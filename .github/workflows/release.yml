name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.7.0)'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4 zip rsync
      - name: Harness
        run: lua5.4 test/run.lua && lua5.4 test/validate_data.lua
      - name: Package
        run: bash scripts/package.sh
      - name: GitHub Release with the zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.zip
          generate_release_notes: true
